version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    ignore:
      # Match the Node runtime major pinned in .nvmrc; upgrade both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      compatible-packages:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]
