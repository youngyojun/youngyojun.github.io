name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified site to GitHub Pages (master only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.deploy) && 'deploy' || 'verify' }}
  cancel-in-progress: ${{ github.event_name != 'push' && !inputs.deploy }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Cache Rust dependencies and WASM tooling
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-${{ runner.os }}-1.94.1-bindgen-0.2.130-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-1.94.1-bindgen-0.2.130-
      - name: Prepare pinned Rust and WASM tooling
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --no-self-update
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen 0.2.130" ]; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test built site in browsers
        id: browser-tests
        run: corepack pnpm test:e2e
      - name: Upload browser failure report
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
      - name: Package verified site for Pages
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
